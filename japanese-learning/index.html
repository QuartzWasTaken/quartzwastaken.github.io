            if (square) {
              if (square.char !== answer[i] || square[SIDE[dir]] != null) return -1;
              crossings++;
            } else if (this.squareAt(r + dc, c + dr) || this.squareAt(r - dc, c - dr)) {
              return -1; // it would run alongside another word
            }
          }
          return crossings === answer.length ? -1 : crossings;
        }

        place(candidate, row, col, dir, crossings) {
          const [dr, dc] = STEP[dir];
          const id = this.placed.length;
          candidate.answer.forEach((char, i) => {
            const r = row + dr * i;
            const c = col + dc * i;
            if (!this.squares[r][c]) {
              this.squares[r][c] = { char, across: null, down: null };
              this.filled++;
            }
            this.squares[r][c][SIDE[dir]] = id;
          });
          this.placed.push({ candidate, row, col, dir });
          this.used.add(candidate.answer.join(''));
          this.crossings += crossings;
          this.weight += candidate.weight;
        }

        /** Every way to cross the candidate into the grid: [row, col, dir, crossings]. */
        crossingSpots(candidate) {
          const spots = [];
          const { answer } = candidate;
          for (let row = 0; row < this.size; row++) {
            for (let col = 0; col < this.size; col++) {
              const square = this.squares[row][col];
              if (!square) continue;
              for (let i = 0; i < answer.length; i++) {
                if (answer[i] !== square.char) continue;
                if (square.across == null) {
                  const crossings = this.crossingsAt(answer, row, col - i, ACROSS);
                  if (crossings > 0) spots.push([row, col - i, ACROSS, crossings]);
                }
                if (square.down == null) {
                  const crossings = this.crossingsAt(answer, row - i, col, DOWN);
                  if (crossings > 0) spots.push([row - i, col, DOWN, crossings]);
                }
              }
            }
          }
          return spots;
        }

        /** Every free spot that touches nothing: [row, col, dir]. */
        looseSpots(candidate) {
          const spots = [];
          for (let row = 0; row < this.size; row++) {
            for (let col = 0; col < this.size; col++) {
              for (const dir of [ACROSS, DOWN]) {
                if (this.crossingsAt(candidate.answer, row, col, dir) === 0) spots.push([row, col, dir]);
              }
            }
          }
          return spots;
        }
      }

      /** One grid from candidates in the given order. `loose`: also place words that cross nothing yet. */
      function buildGrid(order, size, random, loose) {
        const grid = new GridBuilder(size);

        // first word: one of the longest few at the front, somewhere random
        const first =
          order.slice(0, 6).sort((a, b) => b.answer.length - a.answer.length)[Math.floor(random() * 2)] ||
          order[0];
        if (!first) return null;
        const dir = random() < 0.5 ? DOWN : ACROSS;
        const length = first.answer.length;
        const row = dir === DOWN ? Math.floor(random() * (size - length + 1)) : Math.floor(random() * size);
        const col = dir === DOWN ? Math.floor(random() * size) : Math.floor(random() * (size - length + 1));
        grid.place(first, row, col, dir, 0);

        // Kanji share few characters, so kanji grids may also take words that cross nothing yet:
        // up to size × 2 rounds of "cross in all you can, then drop one more word somewhere free".
        const rounds = loose ? size * 2 : 1;
        for (let round = 0; round < rounds; round++) {
          crossInWords(grid, order, random);
          if (!loose || !placeLooseWord(grid, order, random)) break;
        }
        return grid;
      }

      /** Up to three passes over the candidates, crossing each into the grid where it fits best. */
      function crossInWords(grid, order, random) {
        for (let pass = 0; pass < 3; pass++) {
          let added = 0;
          for (const candidate of order) {
            if (grid.isUsed(candidate)) continue;
            const spots = grid.crossingSpots(candidate);
            if (!spots.length) continue;
            // most crossings wins, with a bit of randomness
            const [row, col, dir, crossings] = spots
              .map((spot) => [spot, spot[3] + random() * 0.9])
              .sort((a, b) => b[1] - a[1])[0][0];
            grid.place(candidate, row, col, dir, crossings);
            added++;
          }
          if (!added) break;
        }
      }

      /** Places the first unused candidate that fits somewhere free. False if none does. */
      function placeLooseWord(grid, order, random) {
        for (const candidate of order) {
          if (grid.isUsed(candidate)) continue;
          const spots = grid.looseSpots(candidate);
          if (!spots.length) continue;
          const [row, col, dir] = spots[Math.floor(random() * spots.length)];
          grid.place(candidate, row, col, dir, 0);
          return true;
        }
        return false;
      }

      /**
       * Tries many word orders and keeps the fullest, best-connected grid.
       * `secret`: only keep grids holding all of its kana. Keeps trying (up to 10× longer) until one does,
       * then, as a last resort, also lets words that cross nothing in.
       */
      function bestGrid(candidates, size, random, loose, secret) {
        const tries = size <= 5 ? 220 : size <= 7 ? 140 : size <= 9 ? 80 : 50;
        // longer words get a small boost in big grids
        const weightOf = (c) => c.weight * (1 + c.answer.length / (size * 2));
        let best = null;
        let bestScore = -Infinity;
        for (let t = 0; t < tries || (secret && !best && t < tries * 10); t++) {
          const grid = buildGrid(weightedShuffle(candidates, weightOf, random), size, random, loose);
          if (!grid || (secret && !kanaCells(grid, secret.answer))) continue;
          const score = grid.placed.length * 10 + grid.crossings * 4 + grid.filled + grid.weight * 2;
          if (!best || score > bestScore) {
            best = grid;
            bestScore = score;
          }
        }
        if (secret && !best && !loose) return bestGrid(candidates, size, random, true, secret);
        return best;
      }

      /* ---------- the secret word ---------- */

      // The Daily's secret word depends only on the day and the Daily's word list, not on the grid, so
      // anything that can read the list can work it out: tools/daily-secret.js does it without this code
      // (keep it in step). The grid is then built around the word.
      const SECRET_STRIDE = 7919; // a prime: over N weekdays in a row, a list of N options gives N different words

      /**
       * Words that can be the secret, in list order: not read-only, reading of 3 to 6 kana, and the other
       * words the Daily can use hold each of its kana (as written in the grid) more times than it does.
       * Just as many isn't enough: the grid would need every one of those words, and rarely fits them all.
       */
      function secretOptions(vocab) {
        const answers = candidatesFor(vocab, DAILY_MODE, DAILY_SIZE, '').map((c) => c.answer);
        return vocab.filter((word) => {
          if (word.ro || !isAllKana(word.r)) return false;
          const answer = [...word.r].map(toGridKana);
          if (answer.length < 3 || answer.length > 6) return false;
          const key = answer.join('');
          const others = answers.filter((other) => other.join('') !== key).flat();
          const count = (list, ch) => list.filter((x) => x === ch).length;
          return answer.every((ch) => count(others, ch) > count(answer, ch));
        });
      }

      /**
       * The Daily's secret word: options[(days since 1970-01-01 × 7919) mod options.length],
       * where options = secretOptions(the Daily's word list). Null if there are no options.
       * @returns {{word: Word, answer: string[]}|null}
       */
      function dailySecret(day, vocab) {
        const options = secretOptions(vocab);
        if (!options.length) return null;
        const word = options[(dayNumber(day) * SECRET_STRIDE) % options.length];
        return { word, answer: [...word.r].map(toGridKana) };
      }

      /** Makes words holding the secret's kana come up more, the rarer the kana the more. */
      function favorSecretKana(candidates, answer) {
        for (const ch of new Set(answer)) {
          const needed = answer.filter((x) => x === ch).length;
          const holders = candidates.filter((c) => c.answer.includes(ch));
          for (const c of holders) c.weight *= 1 + (4 * needed) / holders.length;
        }
      }

      /**
       * Squares spelling the answer, one per kana, each kana's squares in reading order; null if the grid
       * lacks some of its kana. With `random`, picks among each kana's squares at random.
       */
      function kanaCells(grid, answer, random) {
        const left = {}; // kana → its squares not used yet
        grid.squares.forEach((line, row) =>
          line.forEach((square, col) => {
            if (square) (left[square.char] ??= []).push([row, col]);
          }),
        );
        const cells = [];
        for (const ch of answer) {
          const list = left[ch];
          if (!list?.length) return null;
          cells.push(list.splice(random ? Math.floor(random() * list.length) : 0, 1)[0]);
        }
        return cells;
      }

      /* ---------- puzzles ---------- */

      /**
       * A numbered puzzle, or null when there aren't enough words for it.
       * `secret` (kana mode): a word to hide in circled squares; the grid is built to hold its kana.
       * @param {{mode: 'kana'|'kanji', size: number, seed: string, day: string, vocab: Word[],
       *   secret?: {word: Word, answer: string[]}|null}} options
       * @returns {Puzzle|null}
       */
      function makePuzzle({ mode, size, seed, day, vocab, secret = null }) {
        const candidates = candidatesFor(vocab, mode, size, day, secret?.answer.join(''));
        if (secret) favorSecretKana(candidates, secret.answer);
        const random = seededRandom(hash(seed));
        const grid =
          candidates.length >= 2 ? bestGrid(candidates, size, random, mode === 'kanji', secret) : null;
        if (!grid) return null;

        // number the squares where words start, row by row
        const numberAt = {};
        const numbers = new Map(); // placement → its number
        let number = 0;
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const starting = grid.placed.filter((p) => p.row === row && p.col === col);
            if (!starting.length) continue;
            number++;
            starting.forEach((p) => numbers.set(p, number));
            numberAt[squareKey(row, col)] = number;
          }
        }

        const clues = grid.placed
          .map((p, id) => {
            const [dr, dc] = STEP[p.dir];
            return {
              id,
              number: numbers.get(p),
              dir: p.dir,
              answer: p.candidate.answer,
              word: p.candidate.word,
              cells: p.candidate.answer.map((_, i) => [p.row + dr * i, p.col + dc * i]),
            };
          })
          .sort((a, b) => a.dir - b.dir || a.number - b.number);
        const signature = clues
          .map((c) => c.number + (c.dir === DOWN ? 'd' : 'a') + c.answer.join(''))
          .join('|');

        return {
          squares: grid.squares,
          numberAt,
          clues,
          signature,
          secret: secret && { ...secret, cells: kanaCells(grid, secret.answer, random) },
        };
      }

      /**
       * The words for a day's Daily: the list frozen by that day's first sync (DAILY_LOCK), so the secret
       * can't change mid-day, or else the current list.
       * @param {{vocab: Word[], lock: {day: string, vocab: Word[]}|null}} words
       */
      const dailyVocab = (day, words) => (words.lock?.day === day ? words.lock.vocab : words.vocab);

      /** The Daily puzzle for a puzzle day. */
      function dailyPuzzle(day, words) {
        const vocab = dailyVocab(day, words);
        return makePuzzle({
          mode: DAILY_MODE,
          size: DAILY_SIZE,
          seed: `daily|${day}`,
          day,
          vocab,
          secret: dailySecret(day, vocab),
        });
      }

      /**
       * Moving around the crossword: the cursor square, the direction (across or down) and the clue the
       * cursor is in. Part of useCrossword.
       */

      const other = (dir) => (dir === ACROSS ? DOWN : ACROSS);

      /**
       * @param {object} state  useCrossword's state
       * @param {{squareAt: (row: number, col: number) => object|null}} grid
       */
      function useCursor(state, { squareAt }) {
        /** The clue running through a square in a direction, or null. */
        function clueThrough(square, dir) {
          const id = square?.[dir === DOWN ? 'down' : 'across'];
          return id == null ? null : state.puzzle.clues.find((clue) => clue.id === id);
        }

        const cursorSquare = () => (state.cursor ? squareAt(...state.cursor) : null);
        const currentClue = computed(() => {
          const square = cursorSquare();
          return clueThrough(square, state.dir) || clueThrough(square, other(state.dir));
        });
        const crossingClue = computed(() => clueThrough(cursorSquare(), other(state.dir)));

        const inGrid = (row, col) =>
          row >= 0 && col >= 0 && row < state.entries.length && col < state.entries.length;
        const isCursor = (row, col) => state.cursor?.[0] === row && state.cursor?.[1] === col;
        const firstEmptyCell = (clue) =>
          clue.cells.find(([row, col]) => !state.entries[row][col]) || clue.cells[0];

        /** Puts the cursor on a square, turning if no word runs that way there. */
        function moveTo(row, col, dir = state.dir) {
          state.cursor = [row, col];
          state.dir = clueThrough(squareAt(row, col), dir) ? dir : other(dir);
        }

        /** A click on the cursor square turns; anywhere else moves there. */
        function clickSquare(row, col) {
          if (isCursor(row, col)) toggleDirection();
          else moveTo(row, col);
        }

        function toggleDirection() {
          if (clueThrough(cursorSquare(), other(state.dir))) state.dir = other(state.dir);
        }

        /** Arrow keys: turn first if the arrow points the other way, then step over black squares. */
        function arrow(dr, dc) {
          const dir = dr ? DOWN : ACROSS;
          if (state.dir !== dir && clueThrough(cursorSquare(), dir)) {
            state.dir = dir;
            return;
          }
          let [row, col] = state.cursor;
          do {
            row += dr;
            col += dc;
          } while (inGrid(row, col) && !squareAt(row, col));
          if (squareAt(row, col)) moveTo(row, col);
        }

        /** Next (or previous) square of the current word. False at the end of the word. */
        function advance(backwards = false) {
          const clue = currentClue.value;
          if (!clue) return false;
          const here = clue.cells.findIndex(([row, col]) => isCursor(row, col));
          const next = clue.cells[here + (backwards ? -1 : 1)];
          if (!next) return false;
          state.cursor = next.slice();
          return true;
        }

        /** The next clue in the list (step 1) or the previous one (-1), at its first empty square. */
        function jumpClue(step) {
          const clue = currentClue.value;
          if (!clue) return;
          const { clues } = state.puzzle;
          const next = clues[(clues.indexOf(clue) + step + clues.length) % clues.length];
          moveTo(...firstEmptyCell(next), next.dir);
        }

        function selectClue(clue) {
          moveTo(...firstEmptyCell(clue), clue.dir);
        }

        return {
          currentClue,
          crossingClue,
          isCursor,
          clickSquare,
          toggleDirection,
          arrow,
          advance,
          jumpClue,
          selectClue,
        };
      }

      /**
       * Romaji → kana while typing: "ka" → か, "tte" → って, "nn" → ん, "-" → ー.
       */

      // prettier-ignore
      const ROMAJI = {
  a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お',
  ka: 'か', ki: 'き', ku: 'く', ke: 'け', ko: 'こ',
  ga: 'が', gi: 'ぎ', gu: 'ぐ', ge: 'げ', go: 'ご',
  sa: 'さ', si: 'し', shi: 'し', su: 'す', se: 'せ', so: 'そ',
  za: 'ざ', zi: 'じ', ji: 'じ', zu: 'ず', ze: 'ぜ', zo: 'ぞ',
  ta: 'た', ti: 'ち', chi: 'ち', tu: 'つ', tsu: 'つ', te: 'て', to: 'と',
  da: 'だ', di: 'ぢ', du: 'づ', de: 'で', do: 'ど',
  na: 'な', ni: 'に', nu: 'ぬ', ne: 'ね', no: 'の',
  ha: 'は', hi: 'ひ', hu: 'ふ', fu: 'ふ', he: 'へ', ho: 'ほ',
  ba: 'ば', bi: 'び', bu: 'ぶ', be: 'べ', bo: 'ぼ',
  pa: 'ぱ', pi: 'ぴ', pu: 'ぷ', pe: 'ぺ', po: 'ぽ',
  ma: 'ま', mi: 'み', mu: 'む', me: 'め', mo: 'も',
  ya: 'や', yu: 'ゆ', yo: 'よ',
  ra: 'ら', ri: 'り', ru: 'る', re: 'れ', ro: 'ろ',
  wa: 'わ', wo: 'を', we: 'うぇ', wi: 'うぃ',
  "n'": 'ん', nn: 'ん', xn: 'ん',
  kya: 'きゃ', kyu: 'きゅ', kyo: 'きょ', gya: 'ぎゃ', gyu: 'ぎゅ', gyo: 'ぎょ',
  sha: 'しゃ', shu: 'しゅ', sho: 'しょ', she: 'しぇ', sya: 'しゃ', syu: 'しゅ', syo: 'しょ',
  ja: 'じゃ', ju: 'じゅ', jo: 'じょ', je: 'じぇ', jya: 'じゃ', jyu: 'じゅ', jyo: 'じょ',
  zya: 'じゃ', zyu: 'じゅ', zyo: 'じょ',
  cha: 'ちゃ', chu: 'ちゅ', cho: 'ちょ', che: 'ちぇ', tya: 'ちゃ', tyu: 'ちゅ', tyo: 'ちょ',
  nya: 'にゃ', nyu: 'にゅ', nyo: 'にょ', hya: 'ひゃ', hyu: 'ひゅ', hyo: 'ひょ',
  bya: 'びゃ', byu: 'びゅ', byo: 'びょ', pya: 'ぴゃ', pyu: 'ぴゅ', pyo: 'ぴょ',
  mya: 'みゃ', myu: 'みゅ', myo: 'みょ', rya: 'りゃ', ryu: 'りゅ', ryo: 'りょ',
  fa: 'ふぁ', fi: 'ふぃ', fe: 'ふぇ', fo: 'ふぉ', thi: 'てぃ', dhi: 'でぃ', tsa: 'つぁ',
  xa: 'ぁ', xi: 'ぃ', xu: 'ぅ', xe: 'ぇ', xo: 'ぉ',
  la: 'ぁ', li: 'ぃ', lu: 'ぅ', le: 'ぇ', lo: 'ぉ',
  xtu: 'っ', ltu: 'っ', xya: 'ゃ', xyu: 'ゅ', xyo: 'ょ', lya: 'ゃ', lyu: 'ゅ', lyo: 'ょ',
  '-': 'ー',
};

      const LONGEST_KEY = 3;
      const WAIT = Symbol('wait for more letters');

      // Every beginning of a key ("c", "ch", "cha", ...), to know when more letters may still come.
      const PREFIXES = new Set(
        Object.keys(ROMAJI).flatMap((key) => [...key].map((_, i) => key.slice(0, i + 1))),
      );

      /** Whether text looks like romaji typed on a Latin keyboard. */
      const isRomaji = (text) => /^[a-zA-Z'-]+$/.test(text);

      /**
       * Converts as much romaji as possible.
       *
       * @param {string} letters  romaji typed so far
       * @param {boolean} finished  the word is over, so a trailing "n" becomes ん
       * @returns {[string, string]}  the kana, and the letters still waiting for more ("ky", "ch", ...)
       */
      function romajiToKana(letters, finished) {
        let kana = '';
        while (letters) {
          // n before a consonant: ん ("kanji" → かんじ)
          if (letters[0] === 'n' && letters.length > 1 && !"aiueoyn'".includes(letters[1])) {
            kana += 'ん';
            letters = letters.slice(1);
            continue;
          }
          // doubled consonant: っ ("tte" → って)
          if (letters.length > 1 && letters[0] === letters[1] && /[bcdfghjklmpqrstvwxyz]/.test(letters[0])) {
            kana += 'っ';
            letters = letters.slice(1);
            continue;
          }
          const match = longestMatch(letters, finished);
          if (match === WAIT) break;
          if (match) {
            kana += ROMAJI[match];
            letters = letters.slice(match.length);
            continue;
          }
          if (letters === 'n' && finished) {
            kana += 'ん';
            letters = '';
            break;
          }
          if (PREFIXES.has(letters)) break; // still typing
          letters = letters.slice(1); // a letter that can't start any kana: drop it
        }
        return [kana, letters];
      }

      /** The longest key at the start of `letters`, WAIT if a longer one could still come, or null. */
      function longestMatch(letters, finished) {
        for (let length = Math.min(LONGEST_KEY, letters.length); length > 0; length--) {
          const key = letters.slice(0, length);
          if (!ROMAJI[key]) continue;
          const couldGrow = [...PREFIXES].some((p) => p.length > length && p.startsWith(key));
          if (length === letters.length && !finished && couldGrow) return WAIT; // "ch" before "cha"
          return key;
        }
        return null;
      }

      // Basic everyday kanji words for the word search, mixed in at a low weight.
      // Words already in the study lists win when the reading is the same. [kanji, reading, meaning]

      /*
 * Page-wide styles: colors, fonts, and the few classes both tabs share.
 * Everything else is styled in its own component.
 */

      :root {
        color-scheme: dark;

        /* surfaces */
        --bg: #191714;
        --panel: #1f1c18;
        --cell: #1d1a17;
        --block: #0c0b0a;
        --hover: #26221d;
        --keypad: #12100e;
        --key: #2a2621;
        --key-action: #3b352d;
        --kbd: #221f1b;

        /* lines */
        --line: #48423a;
        --line-soft: #2c2822;

        /* text */
        --text: #ece4d4;
        --text-soft: #ddd4c3;
        --text-dim: #d6cdbc;
        --muted: #a2998a;
        --faint: #6f675b;
        --number: #cfc6b5;
        --cream: #efe6d5;
        --ink: #1a1714;
        --ink-soft: #5b5348;

        /* accents */
        --accent: #5574d6;
        --theme: #222a3c;
        --theme-text: #9aa4bf;
        --theme-text-light: #aab3cc;
        --word: #26324b;
        --cur: #7c6320;
        --crossing: #211f22;
        --gold: #c9a24a;
        --gold-light: #e0bd6a;
        --flame: #e9823a;

        /* feedback */
        --bad: #e0665a;
        --good: #7fb07a;
        --done: #b4dcae;
        --rev: #8fa4e8;

        /* fonts */
        --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', system-ui, sans-serif;
        --serif: 'Newsreader', 'Noto Serif JP', Georgia, serif;
        --jp-serif: 'Noto Serif JP', serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
      }

      button,
      input {
        color: inherit;
        font: inherit;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 16px 64px;
      }

      /* ---------- buttons ---------- */

      .button {
        padding: 11px 16px;
        border: 1px solid var(--line);
        background: transparent;
        font-size: 16px;
        cursor: pointer;
      }

      .button:hover {
        background: var(--hover);
      }

      .button[aria-pressed='true'] {
        background: var(--cream);
        color: var(--ink);
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--hover);
      }

      .icon-button:disabled {
        background: transparent;
        opacity: 0.35;
        cursor: default;
      }

      .call-to-action {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin: 12px 0 30px;
        padding: 16px 30px;
        border: 0;
        background: var(--cream);
        color: var(--ink);
        font-size: 17px;
        letter-spacing: 0.03em;
        text-decoration: none;
        cursor: pointer;
      }

      .call-to-action.small {
        margin: 0;
        padding: 12px 20px;
        font-size: 16px;
      }

      /* ---------- layout ---------- */

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        margin: 10px 0;
      }

      /* the grid on the left, the clues on the right (stacked on phones) */
      .play-area {
        display: grid;
        grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
        gap: 56px;
        align-items: start;
        margin-top: 22px;
      }

      .grid-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .empty {
        padding: 40px 20px;
        border: 1px dashed var(--line);
        color: var(--muted);
        text-align: center;
      }

      /* ---------- how to play ---------- */

      .how-to-play {
        max-width: 780px;
        margin-top: 64px;
        color: var(--text-dim);
        font-size: 16px;
        line-height: 1.75;
      }

      .how-to-play h2 {
        margin: 0 0 10px;
        color: var(--text);
        font-family: var(--serif);
        font-size: 36px;
        font-weight: 400;
      }

      .how-to-play h3 {
        margin: 22px 0 4px;
        color: var(--text);
        font-size: 17px;
      }

      .how-to-play ul {
        margin: 6px 0;
        padding-left: 20px;
      }

      .how-to-play kbd {
        padding: 1px 6px;
        border: 1px solid var(--line);
        background: var(--kbd);
        font-family: inherit;
        font-size: 14px;
      }

      .how-to-play .footnote {
        margin-top: 40px;
        color: var(--faint);
        font-size: 13px;
      }

      /* ---------- smaller screens ---------- */

      @media (max-width: 900px) {
        .play-area {
          grid-template-columns: 1fr;
          gap: 28px;
        }
      }

      @media (max-width: 560px) {
        .toolbar {
          gap: 10px;
          margin: 8px 0;
        }

        .play-area {
          margin-top: 12px;
        }

        .button {
          padding: 9px 13px;
          font-size: 15px;
        }

        .icon-button {
          width: 46px;
          height: 46px;
        }

        .call-to-action {
          margin: 4px 0 18px;
          padding: 13px 22px;
        }

        .call-to-action.small {
          margin: 0;
          padding: 11px 14px;
        }
      }
    </style>
